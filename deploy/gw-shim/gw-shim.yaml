apiVersion: v1
kind: ConfigMap
metadata:
  name: gw-shim-code
  namespace: qwen-trial
data:
  oai_to_anthropic.py: |
    """An OpenAI chat-completions face over the billing gateway's Anthropic surface, so an arm can change one thing.

    This exists because a two-arm comparison went wrong in a way that was invisible in the outcome. The metered arm
    was run by pointing the agent's **Anthropic** provider at the gateway while the self-hosted arm used its
    **OpenAI-compatible** provider, and the two arms then differed in the client library as well as in the model. The
    consequence was not subtle once measured: the metered arm's requests carried 3, 6, 6, 6, 3666, 3815, 7, 7 prompt
    tokens across a run -- no accumulating history at all -- against the self-hosted arm's cache reads climbing 6,336
    to 23,232 over the same kind of task. 54 times fewer tokens in total. The model was answering nearly blind, and
    its 11 solved of 24 was not comparable to the other arm's 10.

    The gateway was not at fault: a five-message array sent to it directly reported 2,443 input tokens, so it honours
    history. The agent's own store held the full conversations too. The loss was in the provider path, which is
    exactly the kind of thing a candidate tuple is supposed to hold fixed.

    So this translates, and the arm keeps the provider the other arm used. One element of the tuple changes -- the
    model and the endpoint behind it -- and the client code does not.

    **It logs what it forwards.** Message count, content bytes, tool count, and the usage that came back, per
    request. The earlier failure was undetectable from outcomes and obvious from request sizes, and a translator
    nobody can audit is a second place for the same failure to hide.

    Deliberately not general: it covers the shapes an agent actually sends -- system, user, assistant with tool
    calls, tool results, tools, and streaming -- and refuses anything else loudly rather than silently dropping it,
    because silently dropping part of a request is the failure this file is a response to.
    """
    from __future__ import annotations

    import argparse
    import json
    import os
    import sys
    import time
    import urllib.error
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    #: Fields this actually TRANSLATES. Everything else is refused by name, including fields a caller might expect
    #: to be harmless. An earlier version of this set listed ten fields it accepted and never translated -- among
    #: them `parallel_tool_calls`, which changes agent behaviour -- so the file contradicted the fail-closed claim in
    #: its own docstring. A review caught it; the run in flight was unaffected only because the provider in use sends
    #: none of them, which is luck rather than design. Adding one here means writing the translation for it.
    TRANSLATED = {"model", "messages", "tools", "tool_choice", "max_tokens", "max_completion_tokens", "temperature",
                  "top_p", "stream", "stream_options", "stop"}

    #: Whether to mark the reusable part of a request cacheable. Off by default and switched on per deployment,
    #: because it changes what the request costs and therefore what a comparison measures.
    #:
    #: This exists because a two-arm comparison was distorted by its absence. The self-hosted arm read 91.4% of its
    #: input from a prefix cache; the metered arm read 0%, because nothing on that path asked for caching. The
    #: resulting break-even price -- 0.69 dollars per million tokens -- compared an optimised reservation against a
    #: metered arm that had been left unoptimised, which is a fact about the experiment and not about either offering.
    #:
    #: **AND ON THIS GATEWAY IT MUST STAY OFF.** Switching it on was measured, not assumed, and the result is worse
    #: than caching being unavailable: the gateway does not cache the marked blocks, it DROPS them. A four-message
    #: request that carried 4,333 input tokens unmarked came back reporting 25, with the cache legs at zero and the
    #: system prompt, the tool schemas and the history all gone. That is the same silent shrinking that made an
    #: earlier arm worthless, reproduced by a change intended to fix a different distortion -- so the guard below
    #: exists, and the switch defaults off.
    CACHE_MARK_ENV = "SHIM_CACHE_CONTROL"

    #: Below this many billed input tokens per 100 bytes of message content, a reply is treated as evidence that the
    #: request was shrunk in flight rather than answered. Real traffic on this path runs about 45 (2.2 bytes a token);
    #: the two failures seen here both produced ratios two orders of magnitude below it. It is deliberately far under
    #: anything observed, because its job is to catch a collapse and not to police a tokenizer.
    MIN_BILLED_PER_100_BYTES = 2.0

    #: Message roles this understands. An unrecognised role used to become a user turn, which mistranslates a
    #: `developer` or legacy `function` message into something with different meaning.
    ROLES = {"system", "user", "assistant", "tool"}

    #: Content block types this understands, in a message. An image or a refusal block used to vanish.
    CONTENT_BLOCKS = {None, "text"}


    def _text_of(content) -> str:
        if content is None:
            return ""
        if isinstance(content, str):
            return content
        parts = []
        for c in content:
            if isinstance(c, dict) and c.get("type") in (None, "text"):
                parts.append(c.get("text") or "")
        return "\n".join(parts)


    def _mark_cacheable(body: dict, notes: list) -> None:
        """Mark the stable prefix of a request cacheable, the way an agent loop makes it worthwhile.

        Two breakpoints and no more, because the API allows a small number and the useful ones are obvious: the tool
        schemas and system prompt, which are identical on every turn of a run, and the end of the history as it stood
        before the newest turn, which is identical to the previous request's whole history. That second one is what
        turns an agent loop from re-reading its transcript at the fresh rate into re-reading it at the cache rate.

        Nothing here reorders or rewrites content. A cache marker is a hint about what may be reused; if the provider
        ignores it, the reply's own cache legs come back zero and the reconciliation shows it.
        """
        if body.get("tools"):
            body["tools"][-1] = {**body["tools"][-1], "cache_control": {"type": "ephemeral"}}
            notes.append("marked the tool schemas cacheable")
        system = body.get("system")
        if isinstance(system, str) and system:
            body["system"] = [{"type": "text", "text": system, "cache_control": {"type": "ephemeral"}}]
            notes.append("marked the system prompt cacheable")
        msgs = body.get("messages") or []
        if len(msgs) >= 2:
            # The turn before the newest one: everything up to here was in the previous request too.
            target = msgs[-2]
            blocks = target.get("content")
            if isinstance(blocks, list) and blocks:
                blocks[-1] = {**blocks[-1], "cache_control": {"type": "ephemeral"}}
                notes.append(f"marked history through message {len(msgs) - 2} cacheable")


    def to_anthropic(req: dict) -> tuple[dict, list[str]]:
        """Translate an OpenAI chat-completions request. Returns the body and the notes worth logging.

        The mapping that matters and is easy to get wrong: an assistant turn whose content is empty because it
        carried `tool_calls` must survive, and the `tool` messages that follow must keep their ids, or the
        conversation the model receives is not the conversation the agent has.
        """
        notes = []
        untranslated = sorted(set(req) - TRANSLATED)
        if untranslated:
            raise ValueError(f"fields {untranslated} are not translated here. Refused rather than accepted and "
                             "ignored: a parameter dropped in translation changes the candidate, which is the defect "
                             "this face exists to prevent. Adding one means writing its translation")
        for m in req.get("messages") or []:
            if m.get("role") not in ROLES:
                raise ValueError(f"message role {m.get('role')!r} is not translated here; it would otherwise become "
                                 "a user turn, which is a different message")
            c = m.get("content")
            if isinstance(c, list):
                odd = sorted({str(b.get("type")) for b in c if isinstance(b, dict)
                              and b.get("type") not in CONTENT_BLOCKS})
                if odd:
                    raise ValueError(f"content blocks {odd} are not translated here and would be dropped silently")

        system_chunks, msgs = [], []
        for m in req.get("messages") or []:
            role = m.get("role")
            if role == "system":
                system_chunks.append(_text_of(m.get("content")))
                continue
            if role == "tool":
                if not m.get("tool_call_id"):
                    raise ValueError("a tool result with no tool_call_id cannot be paired with its call")
                # Anthropic carries a tool result as a user turn, and the id is what pairs it with the call.
                msgs.append({"role": "user", "content": [{
                    "type": "tool_result", "tool_use_id": m.get("tool_call_id"),
                    "content": _text_of(m.get("content")) or "(no output)"}]})
                continue
            if role == "assistant":
                blocks = []
                text = _text_of(m.get("content"))
                if text:
                    blocks.append({"type": "text", "text": text})
                for tc in m.get("tool_calls") or []:
                    fn = tc.get("function") or {}
                    if not tc.get("id") or not fn.get("name"):
                        raise ValueError("a tool call with no id or no name cannot be paired with its result")
                    try:
                        args = json.loads(fn.get("arguments") or "{}")
                    except json.JSONDecodeError as e:
                        # Rewriting them into a placeholder produced a DIFFERENT tool invocation that looks valid to
                        # the model. Refused instead.
                        raise ValueError(f"tool call {tc.get('id')!r} has unparseable arguments ({e}); rewriting "
                                         "them would send a different invocation than the agent chose") from None
                    blocks.append({"type": "tool_use", "id": tc.get("id"), "name": fn.get("name"), "input": args})
                if not blocks:
                    # An assistant turn with neither text nor a call carries nothing; dropping it is safe and
                    # keeping it would make an empty content block, which the API rejects.
                    notes.append("dropped an assistant turn with no text and no tool call")
                    continue
                msgs.append({"role": "assistant", "content": blocks})
                continue
            msgs.append({"role": "user", "content": [{"type": "text", "text": _text_of(m.get("content"))}]})

        # Consecutive same-role turns are legal for us but not for the API; merged rather than dropped.
        merged = []
        for m in msgs:
            if merged and merged[-1]["role"] == m["role"]:
                merged[-1]["content"] = list(merged[-1]["content"]) + list(m["content"])
            else:
                merged.append(dict(m))
        if len(merged) != len(msgs):
            notes.append(f"merged {len(msgs) - len(merged)} consecutive same-role turn(s)")

        body = {
            "model": req["model"],
            "max_tokens": int(req.get("max_tokens") or req.get("max_completion_tokens") or 4096),
            "messages": merged or [{"role": "user", "content": [{"type": "text", "text": "(empty)"}]}],
        }
        if system_chunks:
            body["system"] = "\n\n".join(x for x in system_chunks if x)
        for src, dst in (("temperature", "temperature"), ("top_p", "top_p")):
            if req.get(src) is not None:
                body[dst] = req[src]
        if req.get("stop"):
            body["stop_sequences"] = req["stop"] if isinstance(req["stop"], list) else [req["stop"]]
        tools = []
        for t in req.get("tools") or []:
            if t.get("type") not in (None, "function"):
                raise ValueError(f"tool type {t.get('type')!r} is not translated here")
            fn = t.get("function") or {}
            if not fn.get("name"):
                raise ValueError("a tool with no name cannot be declared")
            tools.append({"name": fn["name"], "description": fn.get("description") or "",
                          "input_schema": fn.get("parameters") or {"type": "object", "properties": {}}})
        if tools:
            body["tools"] = tools
        if os.environ.get(CACHE_MARK_ENV, "").lower() in ("1", "true", "yes"):
            _mark_cacheable(body, notes)
            notes.append("WARNING: cache marking is on. On the gateway measured here it causes the marked blocks to "
                         "be DROPPED rather than cached, which shrinks the request silently")
        tc = req.get("tool_choice")
        if tc is not None:
            if tc == "auto":
                body["tool_choice"] = {"type": "auto"}
            elif tc == "none":
                body["tool_choice"] = {"type": "none"}
            elif tc == "required":
                body["tool_choice"] = {"type": "any"}
            elif isinstance(tc, dict) and (tc.get("function") or {}).get("name"):
                body["tool_choice"] = {"type": "tool", "name": tc["function"]["name"]}
            else:
                raise ValueError(f"tool_choice {tc!r} is not translated here; omitting it would let the model choose "
                                 "differently than the caller asked")
        return body, notes


    #: Reply stop reasons this maps. An unknown one used to become "stop", which conceals a refusal, a pause or a
    #: safety termination behind the same word a normal completion uses.
    FINISH = {"end_turn": "stop", "stop_sequence": "stop", "max_tokens": "length", "tool_use": "tool_calls"}


    def to_openai(doc: dict, model: str) -> tuple[dict, list[str]]:
        """Translate the reply back, keeping tool calls and the usage the gateway reported.

        Returns the body and anything the translation could not represent. A block type this does not know used to be
        dropped without trace -- thinking, redacted thinking, a server tool result, a citation -- so the caller saw a
        shorter answer and no reason for it.
        """
        text, calls, notes = [], [], []
        for i, block in enumerate(doc.get("content") or []):
            kind = block.get("type")
            if kind == "text":
                text.append(block.get("text") or "")
            elif kind == "tool_use":
                calls.append({"index": len(calls), "id": block.get("id"), "type": "function",
                              "function": {"name": block.get("name"),
                                           "arguments": json.dumps(block.get("input") or {})}})
            else:
                notes.append(f"reply block {i} of type {kind!r} has no representation here and was not forwarded")
        u = doc.get("usage") or {}
        stop = doc.get("stop_reason")
        finish = FINISH.get(stop)
        if finish is None:
            # Surfaced rather than flattened. `stop` for an unknown reason is the one mapping that can turn a refusal
            # into an apparently normal answer.
            notes.append(f"stop_reason {stop!r} is not a reason this maps; reported as 'stop' and named here")
            finish = "stop"
        msg = {"role": "assistant", "content": ("\n".join(text) or None)}
        if calls:
            msg["tool_calls"] = calls
            finish = "tool_calls"
        fresh = int(u.get("input_tokens") or 0)
        cache_read = int(u.get("cache_read_input_tokens") or 0)
        cache_write = int(u.get("cache_creation_input_tokens") or 0)
        out = {
            "id": doc.get("id") or "chatcmpl-shim",
            "object": "chat.completion",
            "created": int(time.time()),
            "model": doc.get("model") or model,
            "choices": [{"index": 0, "message": msg, "finish_reason": finish}],
            # The gateway's own counts, under the disjoint convention the Anthropic surface uses: `prompt_tokens` is
            # the fresh leg only. That is exactly the shape that made the broken arm look like it sent nothing, so the
            # gross total is carried too, under a name of its own, for any consumer that reads one number.
            "usage": {
                "prompt_tokens": fresh,
                "completion_tokens": int(u.get("output_tokens") or 0),
                "total_tokens": fresh + int(u.get("output_tokens") or 0),
                "billed_input_tokens": fresh + cache_read + cache_write,
                "cache_read_input_tokens": cache_read,
                "cache_creation_input_tokens": cache_write,
                "convention": "disjoint: prompt_tokens excludes the cache legs beside it",
            },
        }
        return out, notes


    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"
        upstream = ""
        api_key = ""
        log_path = ""

        def log_message(self, *_a):
            pass

        def _json(self, code: int, payload: dict, headers: dict | None = None):
            body = json.dumps(payload).encode()
            self.send_response(code)
            self.send_header("content-type", "application/json")
            self.send_header("content-length", str(len(body)))
            for k, v in (headers or {}).items():
                self.send_header(k, v)
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path.rstrip("/").endswith("/models"):
                self._json(200, {"object": "list", "data": [{"id": "gateway", "object": "model"}]})
            else:
                self._json(404, {"error": {"message": "only /v1/chat/completions and /v1/models"}})

        def do_POST(self):
            if not self.path.rstrip("/").endswith("/chat/completions"):
                self._json(404, {"error": {"message": "only /v1/chat/completions"}})
                return
            raw = self.rfile.read(int(self.headers.get("content-length") or 0))
            try:
                req = json.loads(raw or b"{}")
            except json.JSONDecodeError as e:
                self._json(400, {"error": {"message": f"unparseable body: {e}"}})
                return
            want_stream = bool(req.pop("stream", False))
            req.pop("stream_options", None)
            try:
                body, notes = to_anthropic(req)
            except ValueError as e:
                # Loudly. A translator that half-honours a request is the failure this file exists to prevent.
                self._json(400, {"error": {"message": str(e), "type": "unsupported_by_shim"}})
                self._record(req, None, [str(e)], refused=True)
                return

            r = urllib.request.Request(
                self.upstream.rstrip("/") + "/v1/messages", data=json.dumps(body).encode(),
                headers={"content-type": "application/json", "anthropic-version": "2023-06-01",
                         "authorization": f"Bearer {self.api_key}"})
            try:
                with urllib.request.urlopen(r, timeout=900) as resp:
                    doc = json.load(resp)
            except urllib.error.HTTPError as e:
                detail = e.read()[:800].decode(errors="replace")
                self._json(e.code, {"error": {"message": f"gateway: {detail}"}})
                self._record(req, None, notes + [f"gateway {e.code}"], refused=True)
                return
            except (urllib.error.URLError, TimeoutError) as e:
                self._json(502, {"error": {"message": f"gateway unreachable: {e}"}})
                self._record(req, None, notes + [f"unreachable: {e}"], refused=True)
                return

            out, reply_notes = to_openai(doc, req.get("model") or "gateway")
            notes = notes + reply_notes
            # The general guard against a request being shrunk in flight, which has now happened twice by two
            # different mechanisms: a client library that sent only the newest turn, and a cache marker that made the
            # gateway drop the blocks it was asked to cache. Both were invisible in the outcomes and immediate in this
            # ratio. Refused rather than warned, because a run that continues past it produces a plausible number.
            content_bytes = sum(len(json.dumps(m.get("content") or "")) for m in (req.get("messages") or []))
            billed = out["usage"]["billed_input_tokens"]
            if content_bytes >= 2000 and billed * 100.0 / content_bytes < MIN_BILLED_PER_100_BYTES:
                detail = (f"the request carried {content_bytes:,} bytes of message content and the reply reports "
                          f"{billed:,} billed input tokens, a ratio of "
                          f"{billed * 100.0 / content_bytes:.2f} per 100 bytes against a floor of "
                          f"{MIN_BILLED_PER_100_BYTES}. Real traffic here runs about 45. Something between this "
                          "process and the model discarded most of the request, which is invisible in an outcome and "
                          "immediate here")
                self._json(502, {"error": {"message": detail, "type": "request_shrunk_in_flight"}})
                self._record(req, out, notes + [detail], refused=True, delivered=False)
                return
            if not want_stream:
                self._json(200, out)
                self._record(req, out, notes, delivered=True)
                return
            # One complete reply, emitted as the two chunks a streaming client needs. Nothing is synthesised that
            # the reply did not contain.
            self.send_response(200)
            self.send_header("content-type", "text/event-stream")
            self.send_header("cache-control", "no-cache")
            self.send_header("connection", "close")
            self.end_headers()
            choice = out["choices"][0]
            first = {"id": out["id"], "object": "chat.completion.chunk", "created": out["created"],
                     "model": out["model"],
                     "choices": [{"index": 0, "delta": choice["message"], "finish_reason": None}]}
            last = {"id": out["id"], "object": "chat.completion.chunk", "created": out["created"],
                    "model": out["model"],
                    "choices": [{"index": 0, "delta": {}, "finish_reason": choice["finish_reason"]}],
                    "usage": out["usage"]}
            delivered = True
            try:
                for chunk in (first, last):
                    self.wfile.write(f"data: {json.dumps(chunk)}\n\n".encode())
                self.wfile.write(b"data: [DONE]\n\n")
                self.wfile.flush()
            except (BrokenPipeError, ConnectionResetError) as e:
                # Recorded as undelivered. Logging before the write made a client that hung up look like a completed
                # call, which is the one thing a request log must not get wrong about its own record.
                delivered = False
                notes.append(f"client disconnected before the reply was delivered: {e}")
            self._record(req, out, notes, delivered=delivered)

        def _record(self, req: dict, out: dict | None, notes: list, refused: bool = False,
                    delivered: bool | None = None):
            """What was forwarded, in the shape that made the earlier failure obvious once someone looked."""
            if not self.log_path:
                return
            msgs = req.get("messages") or []
            row = {
                "ts": time.time(),
                "model": req.get("model"),
                "messages": len(msgs),
                "content_bytes": sum(len(json.dumps(m.get("content") or "")) for m in msgs),
                "tool_messages": sum(1 for m in msgs if m.get("role") == "tool"),
                "assistant_tool_calls": sum(len(m.get("tool_calls") or []) for m in msgs),
                "tools_offered": len(req.get("tools") or []),
                "refused": refused,
                "delivered": delivered,
                # The ordered role sequence, not just a count: a history that stops growing is visible in the count,
                # but a history whose SHAPE changed is only visible here.
                "roles": [m.get("role") for m in msgs],
                "notes": notes,
                "usage": (out or {}).get("usage"),
            }
            try:
                with open(self.log_path, "a") as fh:
                    fh.write(json.dumps(row) + "\n")
            except OSError as e:
                # Not swallowed. An audit record that can vanish silently is not an audit record, and a run whose
                # verification depends on it should stop rather than continue unlogged.
                print(f"[FAIL] could not write the audit record: {e}", file=sys.stderr, flush=True)
                raise


    def main() -> int:
        ap = argparse.ArgumentParser()
        ap.add_argument("--listen", type=int, default=8000)
        ap.add_argument("--upstream", default=os.environ.get("SHIM_UPSTREAM", ""))
        ap.add_argument("--api-key-env", default="SHIM_API_KEY")
        ap.add_argument("--log", default=os.environ.get("SHIM_LOG", ""))
        a = ap.parse_args()
        if not a.upstream:
            print("[FAIL] --upstream or SHIM_UPSTREAM is required", file=sys.stderr)
            return 2
        Handler.upstream = a.upstream
        Handler.api_key = os.environ.get(a.api_key_env, "")
        Handler.log_path = a.log
        if not Handler.api_key:
            print(f"[FAIL] {a.api_key_env} is empty; the gateway will refuse every request", file=sys.stderr)
            return 2
        print(f"listening on :{a.listen}, forwarding to {a.upstream}, logging to {a.log or '(nothing)'}",
              flush=True)
        ThreadingHTTPServer(("0.0.0.0", a.listen), Handler).serve_forever()
        return 0


    if __name__ == "__main__":
        raise SystemExit(main())
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gw-shim
  namespace: qwen-trial
spec:
  replicas: 1
  selector: { matchLabels: { app: gw-shim } }
  template:
    metadata:
      labels: { app: gw-shim }
    spec:
      containers:
        - name: shim
          image: python:3.12-slim
          # The upstream comes from the environment. It was a literal here, pointing at one particular gateway, which
          # is both an environment-specific value in a public manifest and a footgun: applying this unedited sends
          # traffic somewhere the applier did not choose.
          command: ["sh", "-c",
                    'test -n "$SHIM_UPSTREAM" || { echo "set SHIM_UPSTREAM to your gateway base URL" >&2; exit 2; }; '
                    'exec python3 -u /code/oai_to_anthropic.py --listen 8000 --upstream "$SHIM_UPSTREAM" '
                    '--log /data/gw-shim/requests.jsonl']
          env:
            - name: SHIM_UPSTREAM
              value: ""    # set this, or the container refuses to start
            - name: SHIM_API_KEY
              valueFrom: { secretKeyRef: { name: gw-shim-key, key: key } }
          ports: [{ name: http, containerPort: 8000 }]
          volumeMounts:
            - { name: code, mountPath: /code }
            - { name: work, mountPath: /data }
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits: { cpu: "2", memory: "1Gi" }
      initContainers:
        - name: mkdir
          image: python:3.12-slim
          command: ["sh", "-c", "mkdir -p /data/gw-shim"]
          volumeMounts: [{ name: work, mountPath: /data }]
      volumes:
        - name: code
          configMap: { name: gw-shim-code }
        - name: work
          persistentVolumeClaim: { claimName: agent-workspace }
---
apiVersion: v1
kind: Service
metadata:
  name: gw-shim
  namespace: qwen-trial
spec:
  selector: { app: gw-shim }
  ports: [{ name: http, port: 8000, targetPort: http }]
