[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tierbook"
version = "0.1.0"
description = "A ledger of what each inference tier was measured to do, and a router that only reads it"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "littlemex" }]
keywords = ["llm", "routing", "inference", "cost", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The router reads JSON and does arithmetic. It has no runtime dependencies on purpose: a component that
# decides where money goes should not be able to break because something it did not need moved.
dependencies = []

[project.optional-dependencies]
# Only for validating a record you have written by hand. The router does not need it.
schema = ["jsonschema>=4"]
# PyYAML is here and nowhere else: the deploy manifests are YAML and a test that they parse needs a parser. The
# "no runtime dependencies" rule above is about the router, which reads JSON and does arithmetic -- a dev-only parser
# cannot break a component that decides where money goes.
dev = ["pytest>=7", "jsonschema>=4", "pyyaml>=6"]

[project.scripts]
tierbook = "tierbook.cli:main"

[project.urls]
Homepage = "https://github.com/littlemex/tierbook"
Issues = "https://github.com/littlemex/tierbook/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tierbook"]

# `schema.json` lives inside src/tierbook and so travels in the wheel with the modules, which is the point of
# putting it there. Two things read it and one of them is a refusal: the candidate loader derives the set of
# keys a configuration file may NOT contain from this schema, and it raises rather than falling back to "no
# forbidden keys" when the file is missing. Outside the wheel that check would quietly do nothing wherever a
# candidate file is deployed away from a ledger, which is everywhere. A test asserts it is present.

[tool.pytest.ini_options]
# The example's tests are collected with the rest. An example whose tests nobody runs is documentation that has
# stopped being true, and this one exists to prove the mechanism carries logic it has never heard of -- which is a claim
# that has to be checked on every commit rather than the day it was written.
testpaths = ["tests", "harness/tests", "examples/opencode_ops/tests"]
