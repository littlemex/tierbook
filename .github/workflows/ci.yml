# The tests are the specification. Several of them encode claims this project made and then measured to be
# wrong -- a margin that failed out of fold, two candidates swapping rank, a family where the reference was
# not the ceiling -- so a change that makes one pass differently has undone a correction.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      # Full history, tags included. `tests/test_config_aggregation.py` reads the candidate file this project
      # SHIPPED at v0.1.0 out of the tag, deliberately rather than out of the working tree: the point of that test
      # is a record of what a real operator's file looked like, and a copy vendored into the tree would be editable
      # in the same change it polices. actions/checkout defaults to depth 1 with no tags, so without this the tag
      # is not an object in the checkout and the test fails with `invalid object name 'v0.1.0'` -- a failure that
      # reads like a broken test and is a missing fetch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: pytest -q
      # The refusal in the README has to be real. If the shipped example stops refusing at margin 0.15,
      # the README is lying and CI says so before a reader finds out.
      # The 4364 tasks/h below is a HYPOTHETICAL, kept so these two steps still reach the refused-margin
      # path. It is the figure a published number here once used: the observed per-task time times an ASSUMED
      # sixteen requests in flight. The run recorded no timestamps, so it was never measured. The
      # config-driven step further down pins what happens without it.
      - name: the shipped example refuses at the margin that failed out of fold
        run: |
          tierbook compile --registry examples/ledger/tiers --validations examples/ledger/validation \
            --family tool-agent-user-retail=api-strong-a \
            --throughput-per-family tool-agent-user-retail=4364 \
            --margin 0.15 --out /tmp/t.json --today 2026-08-30 | tee /tmp/out.txt
          grep -q "status=refused" /tmp/out.txt
          grep -q "RANK UNSTABLE" /tmp/out.txt
      - name: routing a refused entry fails without the awkward flag
        run: |
          ! tierbook route --table /tmp/t.json --family tool-agent-user-retail
          tierbook route --table /tmp/t.json --family tool-agent-user-retail --allow-unvalidated >/dev/null
      - name: the same command assigns at the margin that held
        run: |
          tierbook compile --registry examples/ledger/tiers --validations examples/ledger/validation \
            --family tool-agent-user-retail=api-strong-a \
            --throughput-per-family tool-agent-user-retail=4364 \
            --margin 0.25 --out /tmp/t25.json --today 2026-08-30 | tee /tmp/out25.txt
          grep -q "status=assigned" /tmp/out25.txt
          tierbook route --table /tmp/t25.json --family tool-agent-user-retail >/dev/null
      - name: the boundary refusals hold from the command line too
        run: |
          python -c "import json,pathlib; b=json.loads(pathlib.Path('examples/ledger/candidates.json').read_text()); b['candidates']['self-hosted-a']['image']='vllm/vllm-openai:latest'; pathlib.Path('/tmp/bad.json').write_text(json.dumps(b))"
          # Serving is not this component's job, and the way to mean that is for the file to fail to load.
          ! tierbook preflight --config /tmp/bad.json 2>&1 | tee /tmp/bad.txt
          grep -q "how to START a model" /tmp/bad.txt
      - name: compiling from the candidate file agrees with compiling from flags
        run: |
          tierbook compile --registry examples/ledger/tiers --validations examples/ledger/validation \
            --config examples/ledger/candidates.json --out /tmp/tc.json --today 2026-08-30 | tee /tmp/outc.txt
          grep -q "objective cost" /tmp/outc.txt
          # The invariant, rather than the ranking it happens to produce: a reservation is NOT amortised into a
          # per-request price. The bill arrives whether or not a request uses the capacity, and an average would be
          # circular because routing to it is what changes the denominator -- so with no accounting window stated,
          # the marginal charge is zero and the economics verdict stays undecidable. Reintroducing an amortised
          # figure (which is how an unmeasured throughput gets in) makes that cost non-zero and fails here.
          #
          # This asserted `api-cheap-a` until 2026-09-10 and was left behind when the decision changed;
          # tests/test_boundary.py carries the authoritative version of the same claim.
          python -c "
          import json
          e = json.load(open('/tmp/tc.json'))['families']['tool-agent-user-retail']['cannot_reject']
          assert e['status'] == 'assigned', e['status']
          sh = next(r for r in e['ranked'] if r['arrangement'] == ['self-hosted-a'])
          if e['self_hosted_economics']['verdict'] == 'undecidable':
              assert sh['cost_per_request'] == 0.0, ('a reservation with no stated accounting window was given a '
                                                    'per-request price', sh, e['self_hosted_economics'])
          assert e['chosen'] == ['self-hosted-a'], e['chosen']
          "
      # The shipped example stops one step short of a router config, and this is the step that says so out loud.
      # Its only rule guards on the occupancy at which the reserved candidate stops meeting its latency target, and
      # no load probe has been run, so no rule can fire and there is nothing to export. That refusal is the correct
      # behaviour -- a router config whose policy cannot fire would route everything to the default while looking
      # like a decision -- and it has been the behaviour since 2026-09-08, when a single probe stopped supporting a
      # capacity bound. Until the probe is run, the positive case lives at the function level in
      # tests/test_boundary.py, which compiles without the guard.
      - name: exporting refuses while the policy has a guard nobody measured
        run: |
          ! tierbook export-vsr --table /tmp/tc.json --config examples/ledger/candidates.json \
            --signal tool-agent-user-retail=retail --default-model api-strong-a --out /tmp/router.json 2>/tmp/exp.txt
          grep -q "no family produced an exportable decision" /tmp/exp.txt
          grep -q "no load probe has been run" /tmp/exp.txt
          grep -q "tool-agent-user-retail" /tmp/exp.txt
          test ! -f /tmp/router.json
      - name: the manifests parse and assume no cluster
        run: |
          python -c "
          import glob, yaml
          for f in sorted(glob.glob('deploy/base/*.yaml')):
              list(yaml.safe_load_all(open(f)))
          "
          # A manifest that names a namespace has made a decision about somebody else's cluster.
          ! grep -rn "^  namespace:" deploy/base/
